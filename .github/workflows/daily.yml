name: Daily Job Watcher

on:
  schedule:
    # 12:17 UTC daily = approximately 06:17 CST / 07:17 CDT.
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: job-watcher-daily
  cancel-in-progress: false

jobs:
  daily:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install project and tests
        run: python -m pip install '.[test]'
      - name: Run offline tests before fetching
        run: python -m pytest
      - name: Fetch and rebuild daily outputs
        run: python -m job_watcher.pipeline
      - name: Verify raw-only history reproducibility
        run: python -m job_watcher.build_history --verify
      - name: Create or update daily issue and close previous run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python -m job_watcher.issues --repo "$GH_REPO"
      - name: Commit only generated data and push main
        run: |
          run_date="$(python -c 'import json; print(json.load(open("data/status.json"))["run_time"][:10])')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/history.csv data/status.json
          if [ -d data/raw ]; then
            git add -A -- data/raw/
          fi
          if git diff --cached --quiet; then
            echo "No generated data changes; daily issue is already updated."
          else
            git commit -m "Daily job watcher run ${run_date}"
            git push origin HEAD:main
          fi
