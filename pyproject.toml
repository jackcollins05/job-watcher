[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-watcher"
version = "0.1.0"
description = "Financial Data Analytics: Finance & Banking Analyst job history"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["job_watcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
